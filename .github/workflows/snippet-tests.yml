# Runs the docs code examples that a pull request touches against a real
# Typesense server, and checks them statically in every language (syntax,
# calls the client libraries do not have, tabs that disagree with each other).
# Only the snippets the diff touches run (snippet-tests/lib/changes.js); a
# change to a test file's shared code runs its page, and a change to the
# harness runs everything.
name: Snippet tests

on:
  pull_request:
    paths:
      - 'docs-site/content/**'
      - 'snippet-tests/**'
      - '.github/workflows/snippet-tests.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Docs version or page to test, e.g. 30.2 or 30.2/api/documents.md'
        required: true
        default: '30.2'

permissions:
  contents: read

concurrency:
  group: snippet-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: snippet-tests
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippet-tests/package-lock.json

      - run: npm ci

      - name: Test the harness itself
        run: npm run self-test

      # Tools some shell examples use.
      - name: Install example dependencies
        run: sudo apt-get install -y --no-install-recommends parallel

      # The static checks parse Python, Ruby, PHP and Go examples with the
      # real tools when present. The runner image ships them all.
      - name: Static check tools
        run: for t in python3 ruby php gofmt bash; do printf '%-8s' "$t"; command -v "$t" >/dev/null && echo found || echo missing; done

      - name: Test changed examples
        if: github.event_name == 'pull_request'
        run: >
          node bin/run.js
          --changed "origin/${{ github.base_ref }}"
          --report ../report.json
          --title "Docs snippet tests"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Test requested examples
        if: github.event_name == 'workflow_dispatch'
        run: >
          node bin/run.js "${{ inputs.target }}"
          --report ../report.json
          --title "Docs snippet tests"
          --summary "$GITHUB_STEP_SUMMARY"

      # Every finding of the example audit (snippet-tests/audit) on the pages
      # this run tested must be flagged.
      - name: Cross-check against the example audit
        if: always() && hashFiles('report.json') != ''
        run: node bin/audit.js --report ../report.json --summary "$GITHUB_STEP_SUMMARY"
